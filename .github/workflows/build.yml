name: Build APK
on: 
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: 
          java-version: '17'
          distribution: 'temurin'
      - run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - run: mkdir -p cmd && wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O t.zip && unzip -q t.zip -d cmd && mv cmd/cmdline-tools cmd/latest
      - run: yes | cmd/latest/bin/sdkmanager --licenses && cmd/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0"
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: 
          name: AppLocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
